services:
  backend:
    build:
      context: ./backend
    environment:
      PARTS_DB_PATH: /var/lib/parts-search/app.db
    ports:
      - "8000:8000"
    volumes:
      - parts-search-data:/var/lib/parts-search
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  parts-search-data:
